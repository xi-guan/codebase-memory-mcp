<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <style>
    /* only the variable in CSS: a fill/stroke rule here would outrank the attributes below */
    svg { --c: #1A5FB4 }
    @media (prefers-color-scheme: dark) { svg { --c: #62A0EA } }
  </style>
  <path fill="none" stroke="var(--c)" stroke-width="2" stroke-linejoin="round" d="M16 5 5 27 27 27Z"/>
  <circle fill="var(--c)" cx="16" cy="5" r="4"/>
  <circle fill="var(--c)" cx="5" cy="27" r="4"/>
  <circle fill="var(--c)" cx="27" cy="27" r="4"/>
</svg>
